<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Asteroseismic Oscillations</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: monospace;
}
    #controls {
      position: absolute;
      top: 10px;
      left: 10px;
      color: white;
      background: rgba(0,0,0,0.7);
      padding: 15px;
      border-radius: 5px;
      font-size: 14px;
    }
    #controls label {
      display: block;
      margin: 8px 0;
    }
    #controls input[type="range"] {
      display: block;
      width: 150px;
      margin-top: 6px;
      margin-left: 0;
    }
    #controls button {
      margin: 5px 5px 5px 0;
      padding: 5px 10px;
      cursor: pointer;
    }
    .value {
      display: inline-block;
      width: 40px;
      text-align: right;
    }
    #modeList {
      margin-top: 15px;
      padding-top: 10px;
      border-top: 1px solid rgba(255,255,255,0.3);
    }
    #modeList strong {
      display: block;
      margin-bottom: 5px;
    }
    #modeItems {
      list-style: none;
      padding: 0;
      margin: 0;
      font-size: 12px;
    }
    #modeItems li {
      padding: 3px 0;
      color: #aaddff;
    }
    #toggleControls {
      position: absolute;
      top: 5px;
      right: -20px;
      width: 20px;
      height: 40px;
      background: rgba(0,0,0,0.7);
      color: white;
      border: none;
      border-radius: 0 5px 5px 0;
      cursor: pointer;
    }
    #controls.collapsed {
      transform: translateX(-90%);
    }
    #controls {
      transition: transform 0.3s ease;
    }
  </style>
</head>
<body>
<div id="globeViz"></div>

<div id="controls">
	<button id="toggleControls">&lt;</button>
  <label>
    <input type="checkbox" id="toggleEquator" checked> Show grid
  </label>
  <label> <input type="checkbox" id="cutawayToggle"> Look inside star </label>
  <label>
    Radial order, n = <span class="value" id="nVal">2</span>
    <input id="n" type="range" min="1" max="8" value="2">
  </label>
  <label>
    Angular degree, ℓ = <span class="value" id="lVal">0</span>
    <input id="l" type="range" min="0" max="8" value="0">
  </label>
  <label>
    Azimuthal order, m = <span class="value" id="mVal">0</span>
    <input id="m" type="range" min="-8" max="8" value="0">
  </label>
  <label>
    Oscillation amplitude, A = <span class="value" id="ampVal">1.50</span>
    <input id="amp" type="range" min="0" max="3" step="0.1" value="1.5">
  </label>
  <label>
    Stellar rotation, Ω = <span class="value" id="rotVal">0.0</span>
    <input id="rot" type="range" min="-2" max="2" step="0.1" value="0.0">
  </label>
  <label>
    Rotation speed multiplier = <span class="value" id="starRotVal">1.00</span>
    <input id="starRot" type="range" min="0" max="3" step="0.1" value="1.0">
  </label>
  <label>
    Speed-up = <span class="value" id="oscSpeedVal">1.00</span>×
    <input id="oscSpeed" type="range" min="0" max="3" step="0.1" value="1.0">
  </label>
  <button id="addMode">Add mode</button>
  <button id="clearModes">Clear modes</button>
  
  <div id="modeList">
    <strong>Active modes:</strong>
    <ul id="modeItems"></ul>
  </div>
</div>

<script type="module" src="js/main.js"></script>
<script>
  const controls = document.getElementById("controls");
  const toggle = document.getElementById("toggleControls");

  toggle.addEventListener("click", () => {
    controls.classList.toggle("collapsed");
	  toggle.textContent = controls.classList.contains("collapsed") ? ">" : "<";
  });
</script>
</body>
</html>
