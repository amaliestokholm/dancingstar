<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Asteroseismic Oscillations</title>
  <style>
    body { margin: 0; overflow: hidden; background: transparent; font-family: monospace; }

    #globeViz {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
    }

    #controls {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      color: #f0f0f0;
      background: rgba(10, 15, 30, 0.75);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      padding: 14px 28px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 18px;
      display: flex;
      gap: 24px;
      align-items: center;
      white-space: nowrap;
      box-shadow: 0 4px 24px rgba(0,0,0,0.4);
    }

    #controls label {
      margin: 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      color: #cce0ff;
      letter-spacing: 0.03em;
    }

    /* Slider track */
    #controls input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 110px;
      height: 4px;
      border-radius: 2px;
      background: rgba(255,255,255,0.2);
      outline: none;
      cursor: pointer;
    }

    #controls input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #7ab4ff;
      box-shadow: 0 0 6px rgba(120, 180, 255, 0.7);
      cursor: pointer;
      transition: background 0.2s;
    }

    #controls input[type="range"]::-webkit-slider-thumb:hover {
      background: #aad4ff;
    }

    #controls input[type="range"]::-moz-range-thumb {
      width: 16px;
      height: 16px;
      border: none;
      border-radius: 50%;
      background: #7ab4ff;
      box-shadow: 0 0 6px rgba(120, 180, 255, 0.7);
      cursor: pointer;
    }

    /* Checkbox */
    #controls input[type="checkbox"] {
      -webkit-appearance: none;
      appearance: none;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 4px;
      background: rgba(255,255,255,0.05);
      cursor: pointer;
      position: relative;
      flex-shrink: 0;
      transition: background 0.2s, border-color 0.2s;
    }

    #controls input[type="checkbox"]:checked {
      background: #7ab4ff;
      border-color: #7ab4ff;
    }

    #controls input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 6px;
      height: 10px;
      border: 2px solid #000;
      border-top: none;
      border-left: none;
      transform: rotate(45deg);
    }

    .value {
      display: inline-block;
      width: 20px;
      text-align: right;
    }

    .divider {
      width: 1px;
      height: 20px;
      background: rgba(255,255,255,0.3);
    }

    .math {
      font-style: italic;
    }
  </style>
</head>
<body>

<div id="globeViz"></div>

<div id="controls">
  <label>
    n = <span class="value" id="nVal">2</span>
    <input id="n" type="range" min="1" max="8" value="2">
  </label>
  <label>
    ℓ = <span class="value" id="lVal">0</span>
    <input id="l" type="range" min="0" max="8" value="0">
  </label>
  <label>
    m = <span class="value" id="mVal">0</span>
    <input id="m" type="range" min="-8" max="8" value="0">
  </label>
  <div class="divider"></div>
  <label>
    <input type="checkbox" id="cutawayToggle"> Expose interior
  </label>
</div>

<script type="module" src="js/main.js"></script>
</body>
</html>
